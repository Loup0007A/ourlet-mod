[[mods]]
modId="ourlet"
version="${version}"
displayName="Ourlet"
authors="Loup0007A"
displayURL="https://github.com/Loup0007A/ourlet-mod"
logoFile="ourlet_logo.png"
description='''
The Spatial Needle sews the space between two block faces, anywhere in a dimension.
Whatever touches one face (players, mobs, items, arrows, blocks pushed by pistons) comes out of the other,
with its exact speed and trajectory. Break, place and use blocks on the far side, through the seam.
No portals, no new blocks: just a stitched fold in the world's fabric.

L'Aiguille Spatiale coud l'espace entre deux faces de blocs : ce qui touche l'une ressort par l'autre.
'''

[[dependencies.ourlet]]
    modId="forge"
    mandatory=true
    versionRange="[51,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ourlet]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21,1.21.2)"
    ordering="NONE"
    side="BOTH"
